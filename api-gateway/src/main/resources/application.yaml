server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/auth/**
            - id: alianza-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/solicitudes/**
            - id: catalogo-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/productos/**