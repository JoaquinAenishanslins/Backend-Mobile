server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: alianza-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/solicitudes/**

        - id: catalogo-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/productos/**